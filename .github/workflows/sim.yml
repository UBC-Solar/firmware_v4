name: SIL tests (Renode)

# Runs sim/ (pytest on emulated boards, see sim/README.md) for each board's Debug build.
# Virtual time runs as fast as the runner can emulate (Board's default), not real time.

on:
  push:
    paths:
      - 'firmware/**'
      - 'sim/**'
      - '.github/workflows/sim.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'sim/**'
      - '.github/workflows/sim.yml'
  workflow_dispatch:

env:
  ARM_TOOLCHAIN: arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi
  ARM_TOOLCHAIN_SHA256: 6cd1bbc1d9ae57312bcd169ae283153a9572bd6a8e4eeae2fedfbc33b115fdbb

jobs:
  sil:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One job per board: each gets its own Renode, so boards run in parallel
        board: [dist, drd, hvc, mdi, mst, str, tel]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache ARM toolchain
        id: arm-cache
        uses: actions/cache@v4
        with:
          path: ~/arm-toolchain.tar.xz
          key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN }}

      - name: Download ARM toolchain
        if: steps.arm-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 --max-time 300 \
            -o ~/arm-toolchain.tar.xz \
            "https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/${ARM_TOOLCHAIN}.tar.xz"
          echo "${ARM_TOOLCHAIN_SHA256}  $HOME/arm-toolchain.tar.xz" | sha256sum --check

      - name: Install build tools
        timeout-minutes: 5
        run: |
          echo "${ARM_TOOLCHAIN_SHA256}  $HOME/arm-toolchain.tar.xz" | sha256sum --check
          mkdir -p ~/arm-toolchain
          tar -xJf ~/arm-toolchain.tar.xz -C ~/arm-toolchain --strip-components=1
          echo "$HOME/arm-toolchain/bin" >> "$GITHUB_PATH"
          python -m pip install --disable-pip-version-check --retries 5 --timeout 30 ninja
          cmake --version | head -1
          ninja --version
          ~/arm-toolchain/bin/arm-none-eabi-gcc --version | head -1

      - name: Build ${{ matrix.board }} (Debug)
        # Same as `make <board>`; called directly because dist has no Makefile target
        run: |
          cmake --preset Debug -S firmware/components/${{ matrix.board }} -B firmware/components/${{ matrix.board }}/build
          cmake --build firmware/components/${{ matrix.board }}/build

      # setup.sh pins the Renode build (and its checksum), so its hash changes exactly when Renode does
      - name: Cache Renode
        uses: actions/cache@v4
        with:
          path: sim/.renode
          key: renode-${{ runner.os }}-${{ hashFiles('sim/setup/setup.sh') }}

      - name: Cache Python environment
        uses: actions/cache@v4
        with:
          path: sim/.venv
          key: sim-venv-${{ runner.os }}-py3.12-${{ hashFiles('sim/requirements.txt') }}

      - name: Set up sim (Renode + Python packages)
        timeout-minutes: 10
        run: sim/setup/setup.sh

      - name: Run SIL tests (${{ matrix.board }})
        run: sim/.venv/bin/pytest sim/tests/${{ matrix.board }} -p no:cacheprovider --durations=10 --junitxml=sim-results-${{ matrix.board }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-results-${{ matrix.board }}
          path: sim-results-${{ matrix.board }}.xml
