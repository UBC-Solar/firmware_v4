---
:project:
  :use_mocks: false
  :use_backtrace: :none
  :build_root: build_sil
  :test_file_prefix: test_ceedling_

# Only directly included modules are linked into each test executable.
# Cube/HAL/FreeRTOS sources and on-device test_scripts are deliberately excluded.
:paths:
  :test:
    - test
  :source:
    - app
    - driver
    - ../../test/support
  :include:
    - app
    - driver
    - ../../test/support
    - ../../common/cyclic_data

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - report_tests_log_factory

:report_tests_log_factory:
  :reports:
    - json

:flags:
  :test:
    :compile:
      '*':
        - -std=c11
        - -Wall
        - -Wextra

# Release semantics: no DEBUG timing calls or STM32 target defines.
:defines:
  :test:
    - TEST

:libraries:
  :system:
    - m
