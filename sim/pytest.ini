[pytest]
testpaths = .
python_files = test_*.py
norecursedirs = _emulator .venv
# Every board folder can have the same test file names (str/test_boot.py, tel/test_boot.py)
addopts = --import-mode=importlib
# sim/ on the import path: `from _emulator import ...`, `from tel.radio import ...`
pythonpath = .
